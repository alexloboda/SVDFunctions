name: check-as-cran

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-as-cran:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Run CRAN-style build and check
        shell: bash
        run: bash ./.github/skills/check-as-cran/scripts/check-as-cran.sh "$GITHUB_WORKSPACE"